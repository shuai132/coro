name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  arm-threadless:
    name: ARM bare-metal components (${{ matrix.cpu }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cpu: [cortex-m0, cortex-m3]
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler and standard library headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libstdc++-arm-none-eabi-dev libnewlib-arm-none-eabi
      - name: Compile single-threaded components without exceptions or RTTI
        run: |
          arm-none-eabi-g++ -std=c++20 -mcpu=${{ matrix.cpu }} -mthumb \
            -fno-exceptions -fno-rtti -DCORO_DISABLE_EXCEPTION -DCORO_TEST_NO_NATIVE_MUTEX \
            -Iinclude -c test/cmake/threadless.cpp -o threadless.o
      - name: Configure and build a threadless CMake consumer
        run: |
          cmake -S test/cmake/threadless -B build_cmake \
            -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_CXX_COMPILER=arm-none-eabi-g++ \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCORO_DISABLE_EXCEPTION=ON \
            -DCMAKE_CXX_FLAGS="-mcpu=${{ matrix.cpu }} -mthumb -fno-exceptions -fno-rtti"
          cmake --build build_cmake --target threadless_consumer -j
      - name: Check single-threaded components need no atomic runtime helpers
        run: |
          arm-none-eabi-nm -u threadless.o > undefined-symbols.txt
          if grep '__atomic_' undefined-symbols.txt; then
            echo "Single-threaded components unexpectedly require an atomic runtime library"
            exit 1
          fi

  gcc10-cmake:
    name: GCC 10 CMake integration (glibc 2.31)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and GCC 10
        run: apt-get update && apt-get install -y --no-install-recommends cmake make g++-10
      - name: Test CMake integration
        env:
          CXX: g++-10
        run: cmake -P test/cmake/run.cmake

  gcc13-debug:
    name: GCC 13 async debugger metadata
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        disable_exception: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Configure async debugger metadata
        env:
          CXX: g++-13
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCORO_DEBUG_ASYNC_STACK=ON -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }}
      - name: Build and test async debugger metadata
        run: |
          cmake --build build --target coro_debug -j
          ./build/coro_debug

  libcxx14-debug:
    name: libc++ 14 async debugger metadata
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        disable_exception: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and libc++ 14
        run: sudo apt-get update && sudo apt-get install -y clang-14 libc++-14-dev libc++abi-14-dev
      - name: Configure async debugger metadata
        env:
          CXX: clang++-14
          CXXFLAGS: -stdlib=libc++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCORO_DEBUG_ASYNC_STACK=ON -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }}
      - name: Build and test async debugger metadata
        run: |
          cmake --build build --target coro_debug -j
          ./build/coro_debug

  build-and-test:

    name: ${{ matrix.toolchain }} ${{ matrix.build_type }} disable_exception:${{ matrix.disable_exception }} sanitize_address:${{ matrix.sanitize_address }} sanitize_thread:${{ matrix.sanitize_thread }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        toolchain:
          - linux-gcc
          - macos-clang
          - windows-msvc
          - windows-mingw

        build_type:
          - Debug
          - Release

        disable_exception:
          - OFF
          - ON

        sanitize_address:
          - OFF
          - ON

        sanitize_thread:
          - OFF
          - ON

        include:
          - toolchain: linux-gcc
            os: ubuntu-latest
            compiler: gcc

          - toolchain: macos-clang
            os: macos-latest
            compiler: clang

          - toolchain: windows-msvc
            os: windows-latest
            compiler: msvc
            env:
              BIN_SUFFIX: ".exe"

          - toolchain: windows-mingw
            os: windows-latest
            compiler: mingw
            env:
              BIN_SUFFIX: ".exe"
              CMAKE_OPTIONS: "-G \"MinGW Makefiles\""

        exclude:
          - sanitize_address: ON
            sanitize_thread: ON

          - toolchain: windows-msvc
            sanitize_address: ON
          - toolchain: windows-msvc
            sanitize_thread: ON

          - toolchain: windows-mingw
            sanitize_address: ON
          - toolchain: windows-mingw
            sanitize_thread: ON

          - toolchain: macos-clang
            sanitize_address: ON
          - toolchain: macos-clang
            sanitize_thread: ON

    steps:
      - uses: actions/checkout@v4

      - name: Init ASIO
        run: git clone https://github.com/chriskohlhoff/asio.git -b asio-1-32-0 --depth=1

      - name: Configure ${{ matrix.build_type }} disable_exception:${{ matrix.disable_exception }} sanitize_address:${{ matrix.sanitize_address }} sanitize_thread:${{ matrix.sanitize_thread }}
        env:
          ASIO_PATH: asio/asio/include
        run: |
          cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }} \
          -DCORO_ENABLE_SANITIZE_ADDRESS=${{ matrix.sanitize_address }} \
          -DCORO_ENABLE_SANITIZE_THREAD=${{ matrix.sanitize_thread }} \
          ${{ matrix.env.CMAKE_OPTIONS }}
        shell: bash

      - name: Test CMake integration
        run: cmake -P test/cmake/run.cmake

      - name: Build with ${{ matrix.compiler }}
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Windows-MSVC Compatible
        if: matrix.os == 'windows-latest' && matrix.compiler == 'msvc'
        working-directory: build
        run: Move-Item -Path .\${{ matrix.build_type }}\* -Destination .\

      - name: Test task(verbose)
        if: always()
        working-directory: build
        run: |
          ./coro_task_verbose${{ matrix.env.BIN_SUFFIX }}

      - name: Test task
        if: always()
        working-directory: build
        run: |
          ./coro_task${{ matrix.env.BIN_SUFFIX }}

      - name: Test core_lifetime
        if: always()
        working-directory: build
        run: |
          ./coro_core_lifetime${{ matrix.env.BIN_SUFFIX }}

      - name: Test debug
        if: always()
        working-directory: build
        run: |
          ./coro_debug${{ matrix.env.BIN_SUFFIX }}

      - name: Test debugger scripts with GDB
        if: matrix.toolchain == 'linux-gcc' && matrix.build_type == 'Debug' && matrix.disable_exception == 'OFF' && matrix.sanitize_address == 'OFF' && matrix.sanitize_thread == 'OFF'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          python3 test/debugger_test.py
          python3 test/debugger_smoke.py gdb build/coro_debug --core

      - name: Test debugger scripts with LLDB
        if: matrix.toolchain == 'macos-clang' && matrix.build_type == 'Debug' && matrix.disable_exception == 'OFF' && matrix.sanitize_address == 'OFF' && matrix.sanitize_thread == 'OFF'
        run: |
          python3 test/debugger_smoke.py lldb build/coro_debug --core

      - name: Test core_callback
        if: always()
        working-directory: build
        run: |
          ./coro_core_callback${{ matrix.env.BIN_SUFFIX }}

      - name: Test core_move_only
        if: always()
        working-directory: build
        run: |
          ./coro_core_move_only${{ matrix.env.BIN_SUFFIX }}

      - name: Test mutex
        if: always()
        working-directory: build
        run: |
          ./coro_mutex${{ matrix.env.BIN_SUFFIX }}

      - name: Test condition_variable
        if: always()
        working-directory: build
        run: |
          ./coro_condition_variable${{ matrix.env.BIN_SUFFIX }}

      - name: Test condition_variable_mt
        if: always()
        working-directory: build
        run: |
          ./coro_condition_variable_mt${{ matrix.env.BIN_SUFFIX }}

      - name: Test channel
        if: always()
        working-directory: build
        run: |
          ./coro_channel${{ matrix.env.BIN_SUFFIX }}

      - name: Test broadcast
        if: always()
        working-directory: build
        run: |
          ./coro_broadcast${{ matrix.env.BIN_SUFFIX }}

      - name: Test when
        if: always()
        working-directory: build
        run: |
          ./coro_when${{ matrix.env.BIN_SUFFIX }}

      - name: Test wait_group
        if: always()
        working-directory: build
        run: |
          ./coro_wait_group${{ matrix.env.BIN_SUFFIX }}

      - name: Test wait_group_mt
        if: always()
        working-directory: build
        run: |
          ./coro_wait_group_mt${{ matrix.env.BIN_SUFFIX }}

      - name: Test latch
        if: always()
        working-directory: build
        run: |
          ./coro_latch${{ matrix.env.BIN_SUFFIX }}

      - name: Test event
        if: always()
        working-directory: build
        run: |
          ./coro_event${{ matrix.env.BIN_SUFFIX }}

      - name: Test semaphore
        if: always()
        working-directory: build
        run: |
          ./coro_semaphore${{ matrix.env.BIN_SUFFIX }}

      - name: Test semaphore_mt
        if: always()
        working-directory: build
        run: |
          ./coro_semaphore_mt${{ matrix.env.BIN_SUFFIX }}

      - name: Test multi_thread
        if: always()
        working-directory: build
        run: |
          ./coro_multi_thread${{ matrix.env.BIN_SUFFIX }}

      - name: Test multi_thread(use single thread)
        if: always()
        working-directory: build
        run: |
          ./coro_multi_thread_st${{ matrix.env.BIN_SUFFIX }}

      - name: Test coro_local
        if: always()
        working-directory: build
        run: |
          ./coro_coro_local${{ matrix.env.BIN_SUFFIX }}

      - name: Test asio_adaptor
        if: always()
        working-directory: build
        run: |
          ./coro_asio_adaptor${{ matrix.env.BIN_SUFFIX }}
