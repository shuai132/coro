name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  instructions:
    name: ARM64 Cachegrind and heap record (Release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install measurement tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-13 valgrind
      - name: Record scoped Cachegrind and allocation counters
        run: python3 benchmark/record_instructions.py --output build_release/instructions/record.json
      - name: Preserve record and source profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instructions-arm64
          path: |
            build_release/instructions/record.json
            build_release/instructions/*.cgout
            build_release/instructions/*.allocations.json
          if-no-files-found: warn

  single-thread:
    name: Global single-thread configuration (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure global single-thread mode
        run: >-
          cmake -S . -B build_single_thread -DCMAKE_BUILD_TYPE=Release
          -DCORO_SINGLE_THREAD=ON -DCORO_BUILD_TEST=ON
          -DCORO_BUILD_EXAMPLES=ON -DCORO_WARNINGS_AS_ERRORS=ON
      - name: Build single-thread tests and examples
        run: cmake --build build_single_thread -j 2
      - name: Run single-thread tests and examples
        run: ctest --test-dir build_single_thread --verbose --output-on-failure

  benchmark-smoke:
    name: Benchmark correctness (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure optional comparisons
        run: >-
          cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release
          -DCORO_BUILD_TEST=OFF -DCORO_BUILD_EXAMPLES=OFF -DCORO_BUILD_BENCHMARKS=ON
      - name: Build comparisons
        run: cmake --build build_release -j 2
      - name: Verify workloads and resource measurements
        run: ctest --test-dir build_release --verbose --output-on-failure

  wasm:
    name: WebAssembly ${{ matrix.build_type }} disable_exception:${{ matrix.disable_exception }}
    runs-on: ubuntu-24.04
    env:
      EMSCRIPTEN_VERSION: 4.0.23
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        disable_exception: [OFF, ON]
    steps:
      - uses: actions/checkout@v5
      - name: Check out Emscripten SDK
        uses: actions/checkout@v5
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSCRIPTEN_VERSION }}
          path: emsdk
          persist-credentials: false
      - name: Install Emscripten SDK
        run: |
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Configure WebAssembly consumer
        shell: bash
        run: |
          source emsdk/emsdk_env.sh
          exception_flags=-fexceptions
          if [[ "${{ matrix.disable_exception }}" == "ON" ]]; then
            exception_flags=-fno-exceptions
          fi
          emcmake cmake -S test/cmake/wasm -B build_wasm \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="$exception_flags" \
            -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }}
      - name: Build WebAssembly consumer and examples
        run: cmake --build build_wasm -j 2
      - name: Run WebAssembly tests with Node.js
        run: ctest --test-dir build_wasm --verbose --output-on-failure

  arm-threadless:
    name: ARM bare-metal components (${{ matrix.cpu }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cpu: [cortex-m0, cortex-m3]
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM compiler and standard library headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libstdc++-arm-none-eabi-dev libnewlib-arm-none-eabi
      - name: Compile single-threaded components without exceptions or RTTI
        run: |
          arm-none-eabi-g++ -std=c++20 -mcpu=${{ matrix.cpu }} -mthumb \
            -Wall -Wunused-parameter -Werror -fno-exceptions -fno-rtti -DCORO_DISABLE_EXCEPTION -DCORO_TEST_NO_NATIVE_MUTEX \
            -Iinclude -c test/cmake/threadless.cpp -o threadless.o
          arm-none-eabi-g++ -std=c++20 -mcpu=${{ matrix.cpu }} -mthumb \
            -Wall -Wunused-parameter -Werror -fno-exceptions -fno-rtti \
            -DCORO_DISABLE_EXCEPTION -DCORO_TEST_NO_NATIVE_MUTEX -DCORO_SINGLE_THREAD \
            -Iinclude -c test/cmake/threadless.cpp -o single-thread.o
      - name: Configure and build a threadless CMake consumer
        run: |
          cmake -S test/cmake/threadless -B build_cmake \
            -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_CXX_COMPILER=arm-none-eabi-g++ \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCORO_DISABLE_EXCEPTION=ON -DCORO_SINGLE_THREAD=ON \
            -DCMAKE_CXX_FLAGS="-mcpu=${{ matrix.cpu }} -mthumb -fno-exceptions -fno-rtti"
          cmake --build build_cmake --target threadless_consumer -j
      - name: Check single-threaded components need no atomic runtime helpers
        run: |
          arm-none-eabi-nm -u threadless.o single-thread.o > undefined-symbols.txt
          if grep '__atomic_' undefined-symbols.txt; then
            echo "Single-threaded components unexpectedly require an atomic runtime library"
            exit 1
          fi

  gcc10-cmake:
    name: GCC 10 CMake integration (glibc 2.31)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake and GCC 10
        run: apt-get update && apt-get install -y --no-install-recommends cmake make g++-10
      - name: Test CMake integration
        env:
          CC: gcc-10
          CXX: g++-10
        run: cmake -P test/cmake/run.cmake

  gcc13-debug:
    name: GCC 13 async debugger metadata
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        disable_exception: [OFF, ON]
    steps:
      - uses: actions/checkout@v5
      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Configure async debugger metadata
        env:
          CXX: g++-13
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCORO_DEBUG_ASYNC_STACK=ON -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }}
      - name: Build and test async debugger metadata
        run: |
          cmake --build build --target coro_debug -j
          ctest --test-dir build -C Debug -R '^coro_debug$' --verbose --output-on-failure

  libcxx14-debug:
    name: libc++ 14 async debugger metadata
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        disable_exception: [OFF, ON]
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang and libc++ 14
        run: sudo apt-get update && sudo apt-get install -y clang-14 libc++-14-dev libc++abi-14-dev
      - name: Configure async debugger metadata
        env:
          CXX: clang++-14
          CXXFLAGS: -stdlib=libc++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCORO_DEBUG_ASYNC_STACK=ON -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }}
      - name: Build and test async debugger metadata
        run: |
          cmake --build build --target coro_debug -j
          ctest --test-dir build -C Debug -R '^coro_debug$' --verbose --output-on-failure

  build-and-test:

    name: ${{ matrix.toolchain }} ${{ matrix.build_type }} disable_exception:${{ matrix.disable_exception }} sanitize_address:${{ matrix.sanitize_address }} sanitize_thread:${{ matrix.sanitize_thread }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        toolchain:
          - linux-gcc
          - macos-clang
          - windows-msvc
          - windows-mingw

        build_type:
          - Debug
          - Release

        disable_exception:
          - OFF
          - ON

        sanitize_address:
          - OFF
          - ON

        sanitize_thread:
          - OFF
          - ON

        include:
          - toolchain: linux-gcc
            os: ubuntu-latest
            compiler: gcc

          - toolchain: macos-clang
            os: macos-latest
            compiler: clang

          - toolchain: windows-msvc
            os: windows-latest
            compiler: msvc

          - toolchain: windows-mingw
            os: windows-latest
            compiler: mingw
            env:
              CMAKE_OPTIONS: "-G \"MinGW Makefiles\""

        exclude:
          - sanitize_address: ON
            sanitize_thread: ON

          - toolchain: windows-msvc
            sanitize_address: ON
          - toolchain: windows-msvc
            sanitize_thread: ON

          - toolchain: windows-mingw
            sanitize_address: ON
          - toolchain: windows-mingw
            sanitize_thread: ON

          - toolchain: macos-clang
            sanitize_address: ON
          - toolchain: macos-clang
            sanitize_thread: ON

    steps:
      - uses: actions/checkout@v5

      - name: Init ASIO
        uses: actions/checkout@v5
        with:
          repository: chriskohlhoff/asio
          ref: asio-1-32-0
          path: asio
          persist-credentials: false

      - name: Configure ${{ matrix.build_type }} disable_exception:${{ matrix.disable_exception }} sanitize_address:${{ matrix.sanitize_address }} sanitize_thread:${{ matrix.sanitize_thread }}
        env:
          ASIO_PATH: asio/asio/include
        run: |
          build_type_options=()
          if [[ "${{ matrix.compiler }}" != "msvc" ]]; then
            build_type_options+=("-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}")
          fi
          cmake -S . -B build \
          "${build_type_options[@]}" \
          -DCORO_ENABLE_FRAME_CACHE=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
          -DCORO_WARNINGS_AS_ERRORS=ON \
          -DCORO_BUILD_EXAMPLES=ON \
          -DCORO_DISABLE_EXCEPTION=${{ matrix.disable_exception }} \
          -DCORO_ENABLE_SANITIZE_ADDRESS=${{ matrix.sanitize_address }} \
          -DCORO_ENABLE_SANITIZE_THREAD=${{ matrix.sanitize_thread }} \
          ${{ matrix.env.CMAKE_OPTIONS }}
        shell: bash

      - name: Test CMake integration
        env:
          ASIO_PATH: asio/asio/include
        run: cmake -P test/cmake/run.cmake

      - name: Build with ${{ matrix.compiler }}
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run tests
        if: always()
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure

      - name: Print test logs
        if: always()
        shell: bash
        run: |
          if [ -f build/Testing/Temporary/LastTest.log ]; then
            cat build/Testing/Temporary/LastTest.log
          fi

      - name: Test debugger scripts with GDB
        if: matrix.toolchain == 'linux-gcc' && matrix.build_type == 'Debug' && matrix.disable_exception == 'OFF' && matrix.sanitize_address == 'OFF' && matrix.sanitize_thread == 'OFF'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          python3 test/debugger_test.py
          python3 test/debugger_smoke.py gdb build/coro_debug --core

      - name: Test debugger scripts with LLDB
        if: matrix.toolchain == 'macos-clang' && matrix.build_type == 'Debug' && matrix.disable_exception == 'OFF' && matrix.sanitize_address == 'OFF' && matrix.sanitize_thread == 'OFF'
        run: |
          python3 test/debugger_smoke.py lldb build/coro_debug --core
